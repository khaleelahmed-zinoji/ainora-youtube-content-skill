    <script>
      const tl = gsap.timeline({ paused: true });
      const Z = 6.55;                                   // zoom-through starts here; clip ends 7.16
      // frame: lands tilted, turns slowly toward the viewer, then straightens and fills the screen
      tl.fromTo("#frame", { opacity: 0, scale: 0.82, rotationY: -22, rotationX: 9, rotation: -3, y: 40 },
                          { opacity: 1, scale: 1, rotationY: -9, rotationX: 4, rotation: -2, y: 0, duration: 0.7, ease: "power3.out" }, 0);
      tl.fromTo("#frame", { rotationY: -9, rotationX: 4, rotation: -2 },
                          { rotationY: -3, rotationX: 2, rotation: -1, duration: Z - 0.7, ease: "sine.inOut", immediateRender: false }, 0.7);
      tl.fromTo("#frame", { rotationY: -3, rotationX: 2, rotation: -1, scale: 1, borderRadius: 26 },
                          { rotationY: 0, rotationX: 0, rotation: 0, scale: 1.84616, borderRadius: 0, duration: 7.16 - Z, ease: "power2.in", immediateRender: false }, Z);
      tl.fromTo("#shine", { x: -1200 }, { x: 1300, duration: 1.1, ease: "power2.inOut" }, 0.5);
      tl.fromTo("#g1", { scale: 0.9, opacity: .4 }, { scale: 1.08, opacity: .6, duration: 7.16, ease: "sine.inOut" }, 0);
      tl.fromTo("#grid", { x: 0, y: 0 }, { x: 40, y: 40, duration: 7.16, ease: "none" }, 0);
      // left: what this is
      tl.fromTo("#tag", { opacity: 0, x: -50 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.45);
      ["#l1", "#l2", "#l3"].forEach((s, i) => tl.fromTo(s, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 1.0 + i * 0.45));
      // right: how it was made
      tl.fromTo("#q", { opacity: 0, x: 50 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 2.6);
      tl.fromTo("#arrow", { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.5, ease: "power2.out" }, 3.3);
      tl.fromTo("#watch", { opacity: 0, y: 20, scale: .9 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.7)" }, 3.75);
      tl.fromTo("#watch", { scale: 1 }, { scale: 1.06, duration: 0.45, yoyo: true, repeat: 3, ease: "sine.inOut", immediateRender: false }, 4.3);
      tl.fromTo("#brand", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 1.2);
      // everything around the frame clears as it fills the screen
      tl.to("#tag, #l1, #l2, #l3, #q, #arrow, #watch, #brand", { opacity: 0, duration: 0.3, ease: "power1.in" }, Z - 0.05);
